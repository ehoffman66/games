<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="512" cy="250" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7a1a10"/>
      <stop offset=".45" stop-color="#2a0f0b"/>
      <stop offset="1" stop-color="#0c0b0a"/>
    </radialGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b3733"/>
      <stop offset="1" stop-color="#1c1a18"/>
    </linearGradient>
    <linearGradient id="slit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb070"/>
      <stop offset=".6" stop-color="#ff5a2a"/>
      <stop offset="1" stop-color="#a0200f"/>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- ceiling lamp -->
  <ellipse cx="512" cy="96" rx="170" ry="60" fill="#ff3b22" opacity=".55" filter="url(#blur)"/>
  <rect x="452" y="70" width="120" height="26" rx="6" fill="#ffd2b0"/>
  <!-- door frame -->
  <rect x="262" y="230" width="500" height="794" fill="#121110"/>
  <rect x="292" y="260" width="440" height="764" fill="url(#door)"/>
  <!-- door panels -->
  <g stroke="#100f0e" stroke-width="8" opacity=".9">
    <line x1="292" y1="470" x2="732" y2="470"/><line x1="292" y1="680" x2="732" y2="680"/><line x1="292" y1="890" x2="732" y2="890"/>
  </g>
  <!-- light leaking from the opening door edge -->
  <rect x="600" y="260" width="34" height="764" fill="#ff5a2a" opacity=".55" filter="url(#blur)"/>
  <rect x="610" y="260" width="14" height="764" fill="url(#slit)"/>
  <!-- holo reticle -->
  <g fill="none" stroke="#ff4a2a" stroke-linecap="round">
    <circle cx="512" cy="560" r="168" stroke-width="30" opacity=".35" filter="url(#soft)"/>
    <circle cx="512" cy="560" r="168" stroke-width="22"/>
    <line x1="512" y1="352" x2="512" y2="440" stroke-width="22"/>
    <line x1="512" y1="680" x2="512" y2="768" stroke-width="22"/>
    <line x1="304" y1="560" x2="392" y2="560" stroke-width="22"/>
    <line x1="632" y1="560" x2="720" y2="560" stroke-width="22"/>
  </g>
  <circle cx="512" cy="560" r="20" fill="#ffd0b8"/>
  <circle cx="512" cy="560" r="40" fill="#ff4a2a" opacity=".5" filter="url(#soft)"/>
</svg>
